name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# กำหนดสิทธิ์ให้ GitHub Actions สามารถเขียน Package ลง GHCR ได้
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # แปลงชื่อ Image เป็น lowercase: ghcr.io/<owner>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # Job 1: Automated Testing
  # ==========================================
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest -v

  # ==========================================
  # Job 2: Build & Push Docker Image to GHCR
  # ==========================================
  build-and-push:
    name: Build & Push Container Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ติดตั้ง Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login เข้า GitHub Container Registry (ghcr.io)
      # ทำงานเฉพาะเมื่อ Push โค้ด (ไม่ทำเมื่อเป็น Pull Request เพื่อความปลอดภัย)
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # สกัด Metadata และสร้าง Tags อัตโนมัติ (เช่น latest, git commit sha)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      # สั่ง Build และ Push ขึ้น GHCR
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
