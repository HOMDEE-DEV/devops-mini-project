name: CI Pipeline

# กำหนดให้ทำงานเมื่อมีการ Push หรือสร้าง Pull Request ไปที่ branch master หรือ main
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  # ==========================================
  # Job ที่ 1: Automated Testing
  # ==========================================
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    # จำลอง Redis Service ขึ้นมาบน Cloud Runner ให้แอปทดสอบเชื่อมต่อได้จริง
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ดึงโค้ดจาก Git Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # ติดตั้ง Python บน Ubuntu Runner
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ติดตั้ง Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # รัน Unit Tests ด้วย Pytest
      - name: Run Pytest
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest -v

  # ==========================================
  # Job ที่ 2: Docker Build & Verification
  # ==========================================
  build-container:
    name: Build & Verify Docker Image
    needs: test # ให้ทำ Job นี้ก็ต่อเมื่อ Test ผ่านแล้วเท่านั้น (CI Best Practice)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ติดตั้ง Docker Buildx (Engine สำหรับการ build image มาตรฐานสากล)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ทดสอบสั่ง Build Dockerfile บน Cloud
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # ทดสอบ Build ให้ผ่านก่อน ยังไม่ต้อง Push ขึ้น Registry
          tags: devops-mini-project:latest
