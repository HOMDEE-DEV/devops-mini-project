version: '3.8'

services:
  # 1. Service ของ Web Application เรา
  web:
    build: .
    container_name: devops-web
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped

  # 2. Service ของ Redis Database
  redis:
    image: redis:7-alpine
    container_name: devops-redis
    # ไม่ต้องเปิด ports ออกข้างนอก ให้คุยกันเองในวงแลนของ Docker เท่านั้น (Security Best Practice)
    restart: unless-stopped
    volumes:
      - redis_data:/data

# 3. Docker Volume สำหรับเก็บข้อมูล Database ไม่ให้หายเวลา Container ดับ
volumes:
  redis_data:
